name: Question
description: Ask about usage or configuration
body:
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: What are you trying to do?

  - type: dropdown
    id: area
    attributes:
      label: Topic
      options:
        - Setup / Usage
        - Configuration / environment
        - Deployment / Docker
        - Development
        - Other
