services:
  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./bot/.env.prod
    depends_on:
      postgres:
        condition: service_healthy
      leetcode-api:
        condition: service_started

  leetcode-api:
    image: alfaarghya/alfa-leetcode-api:2.0.4
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - /usr/local/bin/postgres-bootstrap.sh
    env_file:
      - ./bot/.env.prod
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-bootstrap.sh:/usr/local/bin/postgres-bootstrap.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

