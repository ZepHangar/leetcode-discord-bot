# .orgbot.yml — orgbot per-repo config (see orgbot/lib/repo_config_schema.py).
# Every key optional; unset triggers stay disabled and orgbot does nothing.

enabled: true

triggers:
  label:
    enabled: true
    name: orgbot          # apply this label to an issue/PR to trigger a fix job
  mention:
    enabled: true          # @zep-dev-ai in an issue/PR comment
  pr-review:
    enabled: true          # auto-review every non-draft PR

agent:
  profile: triage-and-fix

policy:
  always_pr: true
